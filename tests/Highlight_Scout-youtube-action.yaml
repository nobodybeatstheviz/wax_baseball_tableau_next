name: "Highlight Scout YouTube Action Tests"
subjectType: AGENT
subjectName: Highlight_Scout

testCases:
  - utterance: "I was at the Yankees vs Royals game on October 5 2024 - find me highlights of that game."
    expectedTopic: game_highlights
    expectedActions:
      - search_highlights
    expectedOutcome: "Agent returns YouTube highlight videos for the October 5 2024 Yankees vs Royals game - each with a title and a youtube.com/watch link taken from the search_highlights action output, never invented."

  - utterance: "Show me highlights from the Red Sox vs Rays game on May 14 2024."
    expectedTopic: game_highlights
    expectedActions:
      - search_highlights
    expectedOutcome: "Agent returns YouTube highlight videos for the May 14 2024 Red Sox vs Rays game with titles and youtube.com/watch links from the action output."

  - utterance: "What's my win rate when I see the Yankees?"
    expectedTopic: off_topic
    expectedOutcome: "Agent honestly says it only fetches game highlight videos and asks for a game date and the two teams - it does not answer metrics questions or guess."
