# Agentforce Studio (NGT) shape of tests/Highlight_Scout-youtube-action.yaml.
# Same three cases; scorers instead of expectations. Created 2026-09-09 to see whether the
# legacy Testing Center runner's "no highlights" result is a runner artifact (variables not
# persisting between reasoning iterations) or the agent's.
name: "HighlightScoutStudioTest"
subjectType: AGENT
subjectName: Highlight_Scout

testCases:
  - inputs:
      - utterance: "I was at the Yankees vs Royals game on October 5 2024 - find me highlights of that game."
    scorers:
      - name: topic_sequence_match
        expected: game_highlights
      - name: action_sequence_match
        expected: "['search_highlights']"
      - name: bot_response_rating
        expected: "Agent returns YouTube highlight videos for the October 5 2024 Yankees vs Royals game - each with a title and a youtube.com/watch link taken from the search_highlights action output, never invented."

  - inputs:
      - utterance: "Show me highlights from the Red Sox vs Rays game on May 14 2024."
    scorers:
      - name: topic_sequence_match
        expected: game_highlights
      - name: action_sequence_match
        expected: "['search_highlights']"
      - name: bot_response_rating
        expected: "Agent returns YouTube highlight videos for the May 14 2024 Red Sox vs Rays game with titles and youtube.com/watch links from the action output."

  - inputs:
      - utterance: "What's my win rate when I see the Yankees?"
    scorers:
      - name: topic_sequence_match
        expected: off_topic
      - name: bot_response_rating
        expected: "Agent honestly says it only fetches game highlight videos and asks for a game date and the two teams - it does not answer metrics questions or guess."
